name: Validate TRIP QUEST TEST
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check site-src/auth.js
          node --check site-src/app.js
          node --check site-src/app-chrome.js
          find site-src/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test staging build
        run: npm test
